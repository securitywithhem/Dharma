name: Dharma E2E Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    # Database and other services are started via Docker Compose in the steps
    # below, since standard GHA services cannot link to our compose config.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Standard runners have ~14GB free — not enough for two multi-stage image
      # builds + service images + the node_modules/.next volume copies compose
      # makes at container creation (round 5 died on "no space left on device").
      # Dropping preinstalled toolchains frees ~25GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Env File for Docker
        run: |
          # docker-compose.yml hard-requires envs/.env.docker (env_file: on the
          # nextjs/worker services, plus ${VAR:?} interpolation). Generate it
          # from the committed template, filling every TODO_* placeholder with
          # a CI-only value (>=32 chars to satisfy the NEXTAUTH_SECRET check).
          sed -e 's/TODO_[A-Z0-9_]*/ci-only-secret-0123456789abcdef0123456789abcdef/g' \
              -e 's|^NEXTAUTH_URL=.*|NEXTAUTH_URL=http://localhost:3000|' \
              envs/.env.docker.example > envs/.env.docker
          # The container runs NODE_ENV=production, which 403s the
          # /api/test-auth and /api/test-seed-pentest backdoors Playwright
          # logs in through — every spec then times out on waitForURL.
          # CI-only flag; never set this in a real deployment.
          echo "ENABLE_E2E_AUTH=true" >> envs/.env.docker

      - name: Build application images
        run: |
          docker compose --env-file envs/.env.docker build nextjs worker
          # The BuildKit cache (intermediate stages) is dead weight once the
          # images are tagged — reclaim it before containers copy volumes.
          docker builder prune -af
          df -h /

      - name: Start Docker Compose Stack
        run: |
          docker compose --env-file envs/.env.docker up -d postgres redis minio ollama nextjs worker
          docker compose --env-file envs/.env.docker ps

      - name: Wait for Next.js Application to be Ready
        run: |
          echo "Waiting for Next.js server to start on port 3000..."
          timeout 120s bash -c '
            until curl -sf http://localhost:3000/api/health >/dev/null; do
              echo "Waiting..."
              sleep 5
            done
          '
          echo "Next.js application is up and running!"

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          # Point Playwright directly to the running host port
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The config uses the default list reporter (no playwright-report/);
          # test-results/ holds the per-test error contexts + traces.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
