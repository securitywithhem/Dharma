# ============================================================
# GitHub Actions CI/CD Pipeline
# Build → Test → Scan → Push → Deploy
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # STAGE 1: Lint & Type Check
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ============================================================
  # STAGE 2: Unit & Integration Tests
  # ============================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_DB: dharma_test
          POSTGRES_USER: dharma
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@10.6.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy --schema packages/db/schema.prisma
      - run: pnpm test
      - uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  # ============================================================
  # STAGE 3: Build Container Image
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 4: Security Scanning
  # ============================================================
  scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: "sarif"
          output: "trivy-results.sarif"

      - uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================
  # STAGE 5: Deploy to Kubernetes (Staging)
  # ============================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image in staging
        run: |
          kubectl set image deployment/nextjs \
            nextjs=${{ needs.build.outputs.image-tag }} \
            -n dharma \
            --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nextjs -n dharma --timeout=5m

  # ============================================================
  # STAGE 6: Deploy to Kubernetes (Production)
  # ============================================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image in production
        run: |
          kubectl set image deployment/nextjs \
            nextjs=${{ needs.build.outputs.image-tag }} \
            -n dharma \
            --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/nextjs -n dharma --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n dharma -l app=nextjs
          kubectl describe deployment nextjs -n dharma

      - name: Run smoke tests
        run: |
          NEXTJS_URL="https://dharma.example.com"
          curl -f -s -o /dev/null -w "%{http_code}" "$NEXTJS_URL/api/health" | grep 200 || exit 1

  # ============================================================
  # STAGE 7: Notify on failure
  # ============================================================
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: failure()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24
        with:
          payload: |
            {
              "text": "❌ Deployment failed on ${{ github.ref }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
