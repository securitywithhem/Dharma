# ============================================================
# Infrastructure validation — Terraform, Helm, GitHub Actions
# ============================================================
# Static validation only: no cloud credentials, no cluster.
# `terraform init -backend=false` skips the S3 state backend so
# validate runs hermetically on any PR.

name: Infrastructure Validate

on:
  pull_request:
    paths:
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/dharma

      - name: Helm template (default values)
        run: helm template dharma helm/dharma --namespace dharma > /dev/null

      - name: Helm template (all toggles on)
        run: |
          helm template dharma helm/dharma --namespace dharma \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set ingress.enabled=true > /dev/null

      # WAVE 10.4 (fullstack-audit-2026-08-06 DEV-5) — the job templated the
      # DEFAULT values plus a synthetic all-toggles-on combination, and never
      # the two files a real deploy actually uses. A break in either could
      # reach production with this workflow green.
      - name: Helm lint and template (the values files CI deploys with)
        run: |
          set -euo pipefail
          for env in staging production; do
            echo "── ${env} ──"
            helm lint helm/dharma -f "helm/dharma/values-${env}.yaml"
            helm template dharma helm/dharma --namespace dharma \
              -f "helm/dharma/values-${env}.yaml" > /dev/null
          done

      # WAVE 6.1 — the pentest guard must keep failing. If someone "fixes" the
      # chart by deleting it, scans go back to queueing forever with no
      # consumer and no error, which is the failure mode ARCH-1 describes.
      - name: Pentest scan backend guard still refuses an unconfigured install
        run: |
          set -euo pipefail
          if helm template dharma helm/dharma --set pentest.enabled=true >/dev/null 2>&1; then
            echo "::error::Chart rendered with pentest.enabled=true and no scanBackend. The ARCH-1 guard is gone."
            exit 1
          fi
          echo "✓ Guard holds."
          # And the supported backend must still render.
          helm template dharma helm/dharma \
            --set pentest.enabled=true --set pentest.scanBackend=external > /dev/null

  # WAVE 10.4 — this workflow triggers on `k8s/**` but validated nothing there.
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      # Schema validation without a cluster. `kubectl apply --dry-run=server`
      # would be stronger (it runs admission control), but needs a live API
      # server; this is the strongest check available in CI and catches the
      # apiVersion/field errors that otherwise surface at deploy time.
      #
      # -strict rejects unknown fields, which is what catches a typo'd key
      # silently doing nothing. NetworkPolicy/LimitRange/ResourceQuota are all
      # built-in kinds, so no CRD schemas are needed.
      - name: Validate k8s manifests
        run: |
          set -euo pipefail
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            k8s/*.yaml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
