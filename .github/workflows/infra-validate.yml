# ============================================================
# Infrastructure validation — Terraform, Helm, GitHub Actions
# ============================================================
# Static validation only: no cloud credentials, no cluster.
# `terraform init -backend=false` skips the S3 state backend so
# validate runs hermetically on any PR.

name: Infrastructure Validate

on:
  pull_request:
    paths:
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/**"
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/dharma

      - name: Helm template (default values)
        run: helm template dharma helm/dharma --namespace dharma > /dev/null

      - name: Helm template (all toggles on)
        run: |
          helm template dharma helm/dharma --namespace dharma \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set ingress.enabled=true > /dev/null

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
