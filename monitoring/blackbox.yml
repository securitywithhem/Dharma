# ============================================================
# monitoring/blackbox.yml
# blackbox_exporter module config — used to synthesize an
# "up/down" health probe for services with no native Prometheus
# /metrics endpoint (currently: Ollama's HTTP API).
# ============================================================
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [] # defaults to 2xx
      method: GET
