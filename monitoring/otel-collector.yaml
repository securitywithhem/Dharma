# ============================================================
# monitoring/otel-collector.yaml
# OpenTelemetry Collector: receives OTLP from the app/worker
# (see src/lib/observability/otel.ts) and re-exposes metrics
# for the existing Prometheus to scrape on :8889.
# Traces currently go to the debug exporter — add a Tempo/Jaeger
# exporter here once a trace backend is deployed.
# ============================================================

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
