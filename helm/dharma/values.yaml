# ============================================================
# Dharma Helm chart — default values
# ============================================================
# This chart deploys the APPLICATION layer only (Next.js app + BullMQ worker).
# Data services (Postgres/pgvector, Redis, MinIO) must be reachable and their
# connection details supplied via `secrets` below (or an existing external Secret).

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# ── Next.js application (built from docker/nextjs/Dockerfile) ──
app:
  replicaCount: 3
  image:
    repository: ghcr.io/securitywithhem/dharma
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  env:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    # To enable OpenTelemetry export (traces + metrics via OTLP/HTTP), point
    # this at a collector, e.g.:
    # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring:4318
  # Extra pod annotations (e.g. prometheus.io/scrape) — applied verbatim.
  podAnnotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ── BullMQ worker (built from docker/worker/Dockerfile) ──
worker:
  replicaCount: 2
  image:
    # Defaults to a separately-built worker image. If you build a single image,
    # point this at the same repository/tag as app.image.
    repository: ghcr.io/securitywithhem/dharma-worker
    tag: latest
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring:4318
  podAnnotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── Database migrations (WAVE 6.2) ──
# Rendered as a pre-install,pre-upgrade Helm hook Job running `npm run
# db:deploy`. Without it, new pods roll out against the old schema and pass
# their health probe while the app is broken — see templates/job-migrate.yaml.
migrations:
  # 0, deliberately: `prisma migrate deploy` failing is nearly always a
  # migration that cannot apply, not a transient error, and retrying it
  # concurrently against shared schema state is worse than failing fast.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ── Pentest scanning (WAVE 6.1) ──
# This chart deploys NO scan consumer. The scan runner shells out to a Docker
# daemon (src/server/pentest/scanner.ts); Kubernetes nodes do not provide one,
# and mounting the host Docker socket into a Pod would grant node-level root in
# a shared cluster — worse than the single-host isolation Compose provides.
#
# With `enabled: true` you MUST state where scans run, or the chart refuses to
# install (templates/deployment-pentest-worker.yaml). Previously a Helm-deployed
# Dharma accepted scans and queued them forever with no consumer and no error.
pentest:
  enabled: false
  # "external"        — the pentest worker runs outside this chart (e.g. the
  #                     Compose pentest-worker on a dedicated host) against the
  #                     same Redis. Nothing is deployed here.
  # "kubernetes-job"  — per-scan Job with a scoped ServiceAccount. NOT YET
  #                     IMPLEMENTED; the chart fails loudly if selected.
  scanBackend: ""

# ── NetworkPolicy (requires a CNI that enforces them, e.g. Calico/Cilium) ──
# Disabled by default because the data services live outside this chart and
# their location (in-cluster vs managed) determines the egress rules.
networkPolicy:
  enabled: false
  ingressControllerNamespace: ingress-nginx
  # Optional list of egress rules (NetworkPolicyEgressRule). Empty = allow all.
  egress: []

# ── PodDisruptionBudgets ──
podDisruptionBudget:
  enabled: true
  app:
    minAvailable: 1
  worker:
    minAvailable: 1

# ── Secret values wired into both app and worker as env ──
# For production, prefer providing these via an existing Secret (set
# `secrets.create: false` and `secrets.existingSecret: <name>`) managed by
# Sealed Secrets / Vault — do NOT commit real values here.
secrets:
  create: true
  existingSecret: ""
  # Placeholder values — override at install time with -f or --set.
  databaseUrl: "postgresql://dharma:CHANGE_ME@postgres:5432/dharma_db?schema=public"
  redisUrl: "redis://:CHANGE_ME@redis:6379"
  minioEndpoint: "minio:9000"
  minioAccessKey: "CHANGE_ME"
  minioSecretKey: "CHANGE_ME"
  nextauthSecret: "CHANGE_ME"

# ── Ingress ──
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: dharma.example.com
  tls:
    enabled: true
    secretName: dharma-tls
