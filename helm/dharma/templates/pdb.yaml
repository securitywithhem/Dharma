{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dharma.fullname" . }}-app
  labels:
    {{- include "dharma.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.app.minAvailable }}
  selector:
    matchLabels:
      {{- include "dharma.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dharma.fullname" . }}-worker
  labels:
    {{- include "dharma.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.worker.minAvailable }}
  selector:
    matchLabels:
      {{- include "dharma.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
