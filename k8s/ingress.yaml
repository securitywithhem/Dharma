# ============================================================
# DEPRECATED — superseded by helm/dharma
# ============================================================
# This file defined the Ingress + TLS Certificate + ClusterIssuer for the app layer
# before helm/dharma existed. CI (.github/workflows/deploy.yml) no longer
# applies this file — it runs `helm upgrade --install` against helm/dharma
# instead, which renders equivalent (but differently-named and
# differently-labeled) resources.
#
# Kept for reference / manual bootstrap only. Do NOT `kubectl apply -f` this
# alongside a Helm-managed release: you'll get two independent sets of
# Deployments/Services answering to different label selectors, and the
# NetworkPolicies in k8s/namespace.yaml (which ARE still in use) only match
# the Helm chart's labels — see that file's own banner.
#
# k8s/namespace.yaml, k8s/postgres.yaml, k8s/redis.yaml, and
# k8s/minio-ollama-worker.yaml remain in use for the data layer; only the
# app/worker/ingress resources in this file are superseded.
# ============================================================

# ============================================================
# Ingress + TLS Certificate
# Requires: cert-manager and ingress-nginx
# ============================================================

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dharma-tls
  namespace: dharma
spec:
  secretName: dharma-tls-secret
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  commonName: dharma.example.com
  dnsNames:
    - dharma.example.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dharma
  namespace: dharma
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dharma.example.com
      secretName: dharma-tls-secret
  rules:
    - host: dharma.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs
                port:
                  number: 3000
          - path: /minio
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000

---
# ClusterIssuer for Let's Encrypt (must be created separately)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
