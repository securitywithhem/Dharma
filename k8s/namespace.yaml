# ============================================================
# Kubernetes Namespace + NetworkPolicy
# ============================================================
#
# STILL IN USE (unlike k8s/nextjs.yaml and k8s/ingress.yaml, which are
# deprecated — see their own banners). The app/worker Deployments now come
# from helm/dharma, but this Namespace, its default-deny NetworkPolicy, and
# the data-layer allow rules below are still how you get postgres/redis/minio
# actually reachable, and are not part of the Helm chart (see
# helm/dharma/README.md: "does NOT deploy data services").
#
# IMPORTANT — label selectors below were updated for the Helm migration.
# The app/worker *source* selectors in the "allow-ingress" and
# "allow-nextjs-{postgres,redis,minio}" / "allow-ollama" / "allow-worker-redis"
# rules used to match `app: nextjs` / `app: worker`, which is what the old
# raw k8s/nextjs.yaml Pods carried. helm/dharma's Pods carry
# `app.kubernetes.io/name: dharma` + `app.kubernetes.io/component: app|worker`
# instead (see helm/dharma/templates/_helpers.tpl's selectorLabels). Under
# this Namespace's default-deny policy, a label mismatch here doesn't error —
# it just silently drops every app/worker -> postgres/redis/minio/ollama
# packet, which is a much worse failure mode to debug than a rejected apply.
# Apply this file to a namespace BEFORE the first `helm upgrade --install`,
# and re-apply it if you ever change fullnameOverride/nameOverride in Helm
# values (that changes the label values these rules must match).

---
apiVersion: v1
kind: Namespace
metadata:
  name: dharma
  labels:
    name: dharma
    environment: production

---
# NetworkPolicy: Deny all ingress, allow only required traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-default-deny
  namespace: dharma
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress from Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-ingress
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dharma
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

---
# Allow NextJS to PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-nextjs-postgres
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5432

---
# Allow NextJS to Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-nextjs-redis
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 6379

---
# Allow NextJS to MinIO
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-nextjs-minio
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 9000

---
# Allow NextJS + Worker to Ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-ollama
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 11434

---
# Allow Worker to Redis (BullMQ)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dharma-allow-worker-redis
  namespace: dharma
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dharma
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 6379

---
# ResourceQuota: Limit namespace resource usage
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dharma-quota
  namespace: dharma
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    pods: "100"
    services: "20"
    persistentvolumeclaims: "10"

---
# LimitRange: Default pod resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: dharma-limits
  namespace: dharma
spec:
  limits:
    - max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Pod
