# ============================================================
# DEPRECATED — superseded by helm/dharma
# ============================================================
# This file defined the app + worker Deployment, Service, ServiceAccount, PodDisruptionBudget, HorizontalPodAutoscaler for the app layer
# before helm/dharma existed. CI (.github/workflows/deploy.yml) no longer
# applies this file — it runs `helm upgrade --install` against helm/dharma
# instead, which renders equivalent (but differently-named and
# differently-labeled) resources.
#
# Kept for reference / manual bootstrap only. Do NOT `kubectl apply -f` this
# alongside a Helm-managed release: you'll get two independent sets of
# Deployments/Services answering to different label selectors, and the
# NetworkPolicies in k8s/namespace.yaml (which ARE still in use) only match
# the Helm chart's labels — see that file's own banner.
#
# k8s/namespace.yaml, k8s/postgres.yaml, k8s/redis.yaml, and
# k8s/minio-ollama-worker.yaml remain in use for the data layer; only the
# app/worker/ingress resources in this file are superseded.
# ============================================================

# ============================================================
# Next.js Application Deployment
# ============================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: dharma
  labels:
    app: nextjs
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nextjs
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - app
      serviceAccountName: nextjs
      containers:
        - name: nextjs
          image: REGISTRY/dharma:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXTAUTH_URL
              value: "https://dharma.example.com"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextjs-secret
                  key: nextauth-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: connection-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: connection-url
            - name: MINIO_ENDPOINT
              value: "minio.dharma.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: OLLAMA_BASE_URL
              value: "http://ollama.dharma.svc.cluster.local:11434"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextjs
  namespace: dharma

---
apiVersion: v1
kind: Service
metadata:
  name: nextjs
  namespace: dharma
  labels:
    app: nextjs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: nextjs

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nextjs
  namespace: dharma
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nextjs

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextjs
  namespace: dharma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextjs
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
